name: Import standalone demo

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import HomePlus demo
        run: |
          git clone --depth 1 https://github.com/gisoogholizade-ux/gisoogholizade-ux.git /tmp/source
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/source/demos/home-services/ ./
          cat > README.md <<'EOF'
          # HomePlus Services Demo

          Interactive home-services marketplace portfolio demo with service selection, price estimation, request creation, order tracking and invoice UI.

          ## Run locally
          Open `index.html` in a browser or serve the folder with any static HTTP server.

          ## Clone
          `git clone https://github.com/gisoogholizade-ux/homeplus-services-demo.git`

          Portfolio demo by FourDevs.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import HomePlus standalone demo"
          git push
